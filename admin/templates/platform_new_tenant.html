{% extends "base.html" %}

{% block content %}
<div style="margin-bottom: 1rem;">
    <a href="/platform" class="btn btn-secondary btn-sm">
        <i class="bi bi-arrow-right"></i> חזרה לניהול פלטפורמה
    </a>
</div>

<div class="page-header animate-fade-in">
    <h1><i class="bi bi-person-plus"></i> לקוח חדש</h1>
</div>

<div class="card animate-slide-up" style="max-width: 700px;">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="tenant_id" class="form-label">מזהה הלקוח</label>
                <input type="text" class="form-input" id="tenant_id" name="tenant_id"
                       required pattern="[a-z0-9][a-z0-9-]{0,31}"
                       placeholder="salon-dana">
                <div class="form-hint">
                    אותיות קטנות באנגלית, ספרות ומקפים. משמש כשם התיקייה של
                    הנתונים ואי אפשר לשנות אותו אחר כך.
                </div>
            </div>

            <div class="form-group">
                <label for="display_name" class="form-label">שם העסק</label>
                <input type="text" class="form-input" id="display_name" name="display_name"
                       required placeholder="סלון דנה">
                <div class="form-hint">
                    השם שיופיע ללקוח בפאנל ובפרומפט של הבוט. זהו מקור האמת
                    היחיד לשם — אין שדה נוסף לעריכה.
                </div>
            </div>

            <div class="d-flex justify-between" style="margin-top: 1.5rem;">
                <a href="/platform" class="btn btn-secondary">ביטול</a>
                <button type="submit" class="btn btn-primary" style="width: auto;">
                    <i class="bi bi-check-lg"></i> יצירה והמשך להקמה
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

# תצורת ruff — lint בלבד, בלי פורמט אוטומטי (הקוד מועתק מריפו קיים
# ושמירה על הדיף קריא חשובה יותר מאחידות פורמט).
line-length = 120
target-version = "py311"

exclude = [
    ".git",
    "__pycache__",
    "data",
]

[lint]
select = ["E", "F", "W", "I"]
# E501 — אורך שורה: הערות בעברית ארוכות מטבען, ה-line-length כבר מוגדל.
#
# ‏PLE2502 (bidirectional-unicode) — הכלל קיים כדי לתפוס קוד שמוסתר
# מאחורי תווי כיוון. אצלנו התווים האלה הם U+200F (RLM) בהערות עברית
# בלבד, והם מה שמונע מ-`hmac.compare_digest` בתחילת משפט עברי להיראות
# `hmac.compare_digest ‏משפט`. הם מיושרים מראש ולא עוטפים קוד. הכלל לא
# נבחר ב-select ממילא (רק E/F/W/I), והשורה כאן קיימת כדי שהוספת "PL"
# בעתיד לא תציף את הריפו באלפי ממצאים על עיצוב תיעוד.
ignore = ["E501", "PLE2502"]

[lint.per-file-ignores]
# טסטים מייבאים מודולים בשביל תופעות לוואי (רישום handlers, patching)
"tests/*" = ["F401"]

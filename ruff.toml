# תצורת ruff — lint בלבד, בלי פורמט אוטומטי (הקוד מועתק מריפו קיים
# ושמירה על הדיף קריא חשובה יותר מאחידות פורמט).
line-length = 120
target-version = "py311"

exclude = [
    ".git",
    "__pycache__",
    "data",
]

[lint]
select = ["E", "F", "W", "I"]
# E501 — אורך שורה: הערות בעברית ארוכות מטבען, ה-line-length כבר מוגדל.
#
# **‏PLE2502 אינו ב-ignore בכוונה.** ‏bidi בקוד הוא וקטור תקיפה אמיתי
# (‏Trojan Source), ופטור גורף היה מכבה את הזיהוי לתמיד. במקום זה
# ‏`tests/test_bidi_safety.py` אוכף את ההבחנה שהכלל עצמו לא יודע לעשות:
# תווי **override/isolate** (‏U+202A–U+202E, ‏U+2066–U+2069) — אסורים,
# כי הם מה שגורם לקוד להיראות אחרת ממה שהוא עושה; ‏RLM/LRM
# (‏U+200E/U+200F) — מותרים, כי הם סימני יישור שאינם עוטפים כלום, והם
# מה שמונע מ-`hmac.compare_digest` בתחילת משפט עברי להיראות הפוך.
ignore = ["E501"]

[lint.per-file-ignores]
# טסטים מייבאים מודולים בשביל תופעות לוואי (רישום handlers, patching)
"tests/*" = ["F401"]

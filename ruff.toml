# תצורת ruff — lint בלבד, בלי פורמט אוטומטי (הקוד מועתק מריפו קיים
# ושמירה על הדיף קריא חשובה יותר מאחידות פורמט).
line-length = 120
target-version = "py311"

exclude = [
    ".git",
    "__pycache__",
    "data",
]

[lint]
select = ["E", "F", "W", "I"]
# E501 — אורך שורה: הערות בעברית ארוכות מטבען, ה-line-length כבר מוגדל.
ignore = ["E501"]

[lint.per-file-ignores]
# טסטים מייבאים מודולים בשביל תופעות לוואי (רישום handlers, patching)
"tests/*" = ["F401"]
